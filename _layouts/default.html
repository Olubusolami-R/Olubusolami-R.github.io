<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title %}{{ page.title }} — Olubusolami Sogunle{% else %}Busola{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
  {% seo %}
</head>
<body>
  <div class="page">

    <nav>
      <a class="nav-name" href="{{ '/' | relative_url }}">Olubusolami Sogunle</a>
      <ul class="nav-links">
        <li><a href="{{ '/#about' | relative_url }}">about</a></li>
        <li><a href="{{ '/#research' | relative_url }}">research</a></li>
        <li><a href="{{ '/#writing' | relative_url }}">writing</a></li>
        <li><a href="{{ '/#contact' | relative_url }}">contact</a></li>
      </ul>
    </nav>

    {{ content }}

    <footer>
      <p>© {{ 'now' | date: "%Y" }} Olubusolami Sogunle &nbsp;·&nbsp; <a href="https://github.com/Olubusolami-R" style="color: inherit; text-decoration: none;">github.com/Olubusolami-R</a></p>
    </footer>

  </div>

  <script>
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(el => {
        if (el.isIntersecting) el.target.classList.add('visible');
      });
    }, { threshold: 0.05 });
    document.querySelectorAll('.row').forEach(el => observer.observe(el));
  </script>
</body>
</html>
